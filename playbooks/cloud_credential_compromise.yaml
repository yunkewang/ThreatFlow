# Cloud Credential Compromise Response Playbook
# Triggered when compromised cloud credentials are detected.
# ATT&CK techniques: T1078.004, T1528, T1098.001

name: Cloud Credential Compromise Response
description: >
  Respond to detected compromise of cloud IAM credentials (leaked access keys,
  stolen OAuth tokens, suspicious cloud API activity). Revokes credentials,
  suspends the identity, restricts storage access, and documents the incident.
version: "1.0.0"
triggers:
  - T1078.004
  - T1528
  - T1098.001
severity: critical

inputs:
  - name: principal_id
    type: string
    required: true
    description: Cloud principal identifier (ARN, UPN, or service account email).
  - name: cloud_provider
    type: string
    required: true
    description: Cloud platform (aws, azure, gcp).
  - name: affected_storage
    type: string
    required: false
    default: ""
    description: Storage resource at risk (e.g. s3://bucket-name). Leave empty if N/A.

steps:

  - id: create_case
    action: create_case
    provider: defender
    params:
      title: "Cloud Credential Compromise — {{ principal_id }}"
      description: "Compromised {{ cloud_provider }} credentials for {{ principal_id }}"
      severity: critical
      tags:
        - cloud
        - credential-compromise
    on_error: stop

  - id: revoke_credentials
    action: revoke_cloud_credentials
    provider: defender
    params:
      principal_id: "{{ principal_id }}"
      cloud_provider: "{{ cloud_provider }}"
      rotate_keys: false
    on_error: continue

  - id: suspend_identity
    action: suspend_cloud_identity
    provider: defender
    params:
      principal_id: "{{ principal_id }}"
      cloud_provider: "{{ cloud_provider }}"
      reason: "Suspended due to credential compromise — case {{ create_case.case_id }}"
    on_error: continue

  - id: lock_storage
    action: restrict_storage_access
    provider: defender
    condition: "affected_storage != ''"
    params:
      resource_id: "{{ affected_storage }}"
      cloud_provider: "{{ cloud_provider }}"
      block_public_access: true
    on_error: continue

  - id: document_principal
    action: add_artifact
    provider: defender
    params:
      case_id: "{{ create_case.case_id }}"
      artifact_type: username
      artifact_value: "{{ principal_id }}"
      description: "Compromised cloud principal ({{ cloud_provider }})"
